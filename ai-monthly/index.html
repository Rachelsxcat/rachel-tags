<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI月度汇报 · Rachel</title>
<meta name="description" content="Rachel的AI月度汇报，按月份展示AI产品进展、业务应用及后续规划。">
<style>
:root{color-scheme:light;--ink:#173859;--sub:#617d96;--line:#dce8f2;--blue:#246da2}
*{box-sizing:border-box}
body{margin:0;font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;background:linear-gradient(135deg,#fff 0%,#f4f9fd 100%);color:var(--ink);min-height:100vh}
main{max-width:940px;margin:0 auto;padding:78px 24px 65px}
.back{display:inline-block;color:var(--blue);font-size:14px;text-decoration:none;margin-bottom:32px}
.back:hover{text-decoration:underline}
.kicker{color:#347ba9;font-size:13px;font-weight:700;letter-spacing:.15em}
h1{font-size:42px;letter-spacing:-.04em;margin:16px 0 15px}
.lead{color:var(--sub);font-size:18px;line-height:1.7;margin-bottom:37px}
h2{font-size:20px;margin:29px 0 15px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:40px}
.card{border:1px solid var(--line);border-radius:17px;background:#fff;padding:22px 24px;text-decoration:none;color:inherit;transition:box-shadow .15s,border-color .15s,transform .15s;display:block}
.card:hover{border-color:#8ebbd9;box-shadow:0 14px 30px #1a4c7020;transform:translateY(-2px)}
.card:focus-visible,.back:focus-visible{outline:3px solid #dda14d}
.card strong{display:block;font-size:21px;margin:0 0 9px}
.card p{font-size:15px;color:var(--sub);line-height:1.7;margin:0 0 15px}
.card .action{font-size:13px;color:var(--blue);font-weight:700}
footer{border-top:1px solid var(--line);padding-top:17px;color:#91a4b4;font-size:13px}
@media(max-width:620px){main{padding:46px 20px}h1{font-size:32px}.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <a class="back" href="../">← 返回AI项目导航首页</a>
  <div class="kicker">RACHEL / AI MONTHLY REPORTS</div>
  <h1>AI月度汇报</h1>
  <p class="lead">汇集Rachel每月的AI产品进展、重点专项和建设规划，按月份查看对应的交互式汇报。</p>
  <section><h2>2026年</h2><div class="cards">
    <a class="card" href="./2026-09/"><strong>2026年9月</strong><p>OEC-AI产品进度说明和规划，涵盖AI应用现状、重点问题推进与AI建设规划。</p><span class="action">查看9月汇报 ↗</span></a>
  </div></section>
  <footer>后续月份的汇报将在此持续更新。</footer>
</main>
</body>
</html>
